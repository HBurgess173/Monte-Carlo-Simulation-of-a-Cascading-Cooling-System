<svg width="980" height="260" viewBox="0 0 980 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Cascading cooling system</title>
  <desc id="desc">Simple diagram showing HVAC passing load to CW, CW passing total load to FW, and FW rejecting heat to the ultimate heat sink.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f3a45"/>
    </marker>
    <style>
      .title { font: 700 24px Arial, Helvetica, sans-serif; fill: #1f2933; }
      .box-title { font: 700 22px Arial, Helvetica, sans-serif; fill: #ffffff; }
      .box-subtitle { font: 14px Arial, Helvetica, sans-serif; fill: #eef4f8; }
      .note { font: 15px Arial, Helvetica, sans-serif; fill: #334155; }
      .small { font: 13px Arial, Helvetica, sans-serif; fill: #475569; }
      .arrow-label { font: 14px Arial, Helvetica, sans-serif; fill: #334155; }
    </style>
  </defs>

  <rect x="0" y="0" width="980" height="260" rx="16" fill="#f8fafc"/>
  <text x="490" y="36" text-anchor="middle" class="title">Cascading Cooling System Load Propagation</text>

  <rect x="50" y="78" width="170" height="86" rx="10" fill="#2563eb"/>
  <text x="135" y="113" text-anchor="middle" class="box-title">HVAC</text>
  <text x="135" y="139" text-anchor="middle" class="box-subtitle">2326 local consumers</text>

  <rect x="300" y="78" width="170" height="86" rx="10" fill="#0891b2"/>
  <text x="385" y="113" text-anchor="middle" class="box-title">CW</text>
  <text x="385" y="139" text-anchor="middle" class="box-subtitle">HVAC total + 199</text>

  <rect x="550" y="78" width="170" height="86" rx="10" fill="#059669"/>
  <text x="635" y="113" text-anchor="middle" class="box-title">FW</text>
  <text x="635" y="139" text-anchor="middle" class="box-subtitle">CW total + 66</text>

  <rect x="800" y="78" width="150" height="86" rx="10" fill="#64748b"/>
  <text x="875" y="108" text-anchor="middle" class="box-title">Ultimate</text>
  <text x="875" y="133" text-anchor="middle" class="box-title">Heat Sink</text>

  <line x1="230" y1="121" x2="286" y2="121" stroke="#2f3a45" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="480" y1="121" x2="536" y2="121" stroke="#2f3a45" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="730" y1="121" x2="786" y2="121" stroke="#2f3a45" stroke-width="4" marker-end="url(#arrow)"/>

  <text x="258" y="100" text-anchor="middle" class="arrow-label">HVAC load</text>
  <text x="508" y="100" text-anchor="middle" class="arrow-label">CW total load</text>
  <text x="758" y="100" text-anchor="middle" class="arrow-label">FW total load</text>

  <text x="135" y="204" text-anchor="middle" class="note">HVAC total = HVAC local loads</text>
  <text x="385" y="204" text-anchor="middle" class="note">CW total = HVAC total + CW local loads</text>
  <text x="635" y="204" text-anchor="middle" class="note">FW total = CW total + FW local loads</text>
  <text x="875" y="204" text-anchor="middle" class="note">Heat rejected externally</text>

  <text x="490" y="238" text-anchor="middle" class="small">Downstream systems include their own local consumers plus the propagated upstream load.</text>
</svg>
