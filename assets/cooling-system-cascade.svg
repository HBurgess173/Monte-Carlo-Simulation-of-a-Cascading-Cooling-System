<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Cascading Cooling System</title>
  <desc id="desc">Simple cascade diagram showing HVAC flowing to CW, then FW, then the ultimate heat sink.</desc>

  <defs>
    <linearGradient id="background" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f8fbfd"/>
      <stop offset="100%" stop-color="#eef5f8"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#17324d" flood-opacity="0.14"/>
    </filter>

    <marker id="arrow-hvac" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7b5aa6"/>
    </marker>

    <marker id="arrow-cw" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3f83a3"/>
    </marker>

    <marker id="arrow-fw" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5f9f77"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="300" rx="24" fill="url(#background)"/>

  <text x="600" y="52" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#1f2f3d">
    Cascading Cooling System
  </text>

  <g font-family="Arial, Helvetica, sans-serif">
    <g filter="url(#shadow)">
      <rect x="70" y="105" width="190" height="95" rx="18" fill="#ffffff" stroke="#7b5aa6" stroke-width="2.5"/>
      <rect x="70" y="105" width="190" height="12" rx="6" fill="#7b5aa6"/>
      <text x="165" y="148" text-anchor="middle" font-size="28" font-weight="700" fill="#553b78">HVAC</text>
      <text x="165" y="176" text-anchor="middle" font-size="16" fill="#607080">Initial load</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="360" y="105" width="190" height="95" rx="18" fill="#ffffff" stroke="#3f83a3" stroke-width="2.5"/>
      <rect x="360" y="105" width="190" height="12" rx="6" fill="#3f83a3"/>
      <text x="455" y="148" text-anchor="middle" font-size="28" font-weight="700" fill="#2d637d">CW</text>
      <text x="455" y="176" text-anchor="middle" font-size="16" fill="#607080">HVAC + CW load</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="650" y="105" width="190" height="95" rx="18" fill="#ffffff" stroke="#5f9f77" stroke-width="2.5"/>
      <rect x="650" y="105" width="190" height="12" rx="6" fill="#5f9f77"/>
      <text x="745" y="148" text-anchor="middle" font-size="28" font-weight="700" fill="#437254">FW</text>
      <text x="745" y="176" text-anchor="middle" font-size="16" fill="#607080">CW + FW load</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="940" y="105" width="205" height="95" rx="18" fill="#ffffff" stroke="#d78b4b" stroke-width="2.5"/>
      <rect x="940" y="105" width="205" height="12" rx="6" fill="#d78b4b"/>
      <text x="1042.5" y="142" text-anchor="middle" font-size="24" font-weight="700" fill="#9a6336">Ultimate</text>
      <text x="1042.5" y="169" text-anchor="middle" font-size="24" font-weight="700" fill="#9a6336">Heat Sink</text>
    </g>

    <path d="M 272 152.5 C 300 152.5, 320 152.5, 348 152.5" fill="none" stroke="#7b5aa6" stroke-width="9" stroke-linecap="round" marker-end="url(#arrow-hvac)"/>
    <path d="M 562 152.5 C 590 152.5, 610 152.5, 638 152.5" fill="none" stroke="#3f83a3" stroke-width="9" stroke-linecap="round" marker-end="url(#arrow-cw)"/>
    <path d="M 852 152.5 C 880 152.5, 900 152.5, 928 152.5" fill="none" stroke="#5f9f77" stroke-width="9" stroke-linecap="round" marker-end="url(#arrow-fw)"/>

    <text x="310" y="222" text-anchor="middle" font-size="15" fill="#607080">HVAC load propagates</text>
    <text x="600" y="222" text-anchor="middle" font-size="15" fill="#607080">CW total propagates</text>
    <text x="890" y="222" text-anchor="middle" font-size="15" fill="#607080">FW rejects heat</text>
  </g>
</svg>
