<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640" role="img" aria-labelledby="title desc">
  <title id="title">Sankey diagram of the cascading cooling system</title>
  <desc id="desc">Heat loads from 2326 consumers enter HVAC. The total HVAC load flows to chilled water and combines with loads from 199 CW consumers. The total chilled-water load flows to fresh water and combines with loads from 66 FW consumers. The accumulated system heat load is rejected to an external reservoir.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbfd"/>
      <stop offset="1" stop-color="#eef5f8"/>
    </linearGradient>
    <linearGradient id="mainFlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6577d8" stop-opacity="0.82"/>
      <stop offset="0.48" stop-color="#269ac3" stop-opacity="0.82"/>
      <stop offset="1" stop-color="#24a77d" stop-opacity="0.84"/>
    </linearGradient>
    <linearGradient id="rejectFlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#24a77d" stop-opacity="0.84"/>
      <stop offset="1" stop-color="#efad39" stop-opacity="0.84"/>
    </linearGradient>
    <marker id="arrowHvac" markerWidth="34" markerHeight="34" refX="27" refY="17" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L34 17 L0 34 Z" fill="#527fc8"/>
    </marker>
    <marker id="arrowCw" markerWidth="38" markerHeight="38" refX="30" refY="19" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L38 19 L0 38 Z" fill="#3196b7"/>
    </marker>
    <marker id="arrowFw" markerWidth="42" markerHeight="42" refX="33" refY="21" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L42 21 L0 42 Z" fill="#27a17e"/>
    </marker>
    <marker id="arrowReject" markerWidth="46" markerHeight="46" refX="36" refY="23" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L46 23 L0 46 Z" fill="#cda044"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#19354b" flood-opacity="0.14"/>
    </filter>
    <style>
      text { font-family: Inter, "Segoe UI", Arial, sans-serif; fill: #17324d; }
      .system-code { font-size: 31px; font-weight: 800; text-anchor: middle; }
      .system-name { font-size: 15px; font-weight: 600; text-anchor: middle; fill: #536b7d; }
      .source-number { font-size: 29px; font-weight: 800; text-anchor: middle; }
      .source-label { font-size: 15px; font-weight: 650; text-anchor: middle; fill: #536b7d; }
      .flow-title { font-size: 17px; font-weight: 750; text-anchor: middle; fill: #176b87; }
      .flow-detail { font-size: 14px; font-weight: 550; text-anchor: middle; fill: #587183; }
    </style>
  </defs>

  <rect width="1600" height="820" rx="26" fill="url(#background)"/>
  <text x="800" y="57" font-size="35" font-weight="800" text-anchor="middle">Cascading Cooling System — Energy Flow</text>
  <text x="800" y="88" font-size="17" font-weight="500" text-anchor="middle" fill="#5b7081">Sankey-style representation of cumulative heat-load propagation</text>

  <!-- Main cumulative energy-flow arrows -->
  <path d="M335 427 H445 V403 L505 455 L445 507 V483 H335 Z" fill="#527fc8" stroke="#416eb7" stroke-width="2" stroke-linejoin="round"/>
  <path d="M625 421 H775 V393 L840 455 L775 517 V489 H625 Z" fill="#3196b7" stroke="#2484a5" stroke-width="2" stroke-linejoin="round"/>
  <path d="M960 411 H1365 V375 L1440 455 L1365 535 V499 H960 Z" fill="url(#rejectFlow)" stroke="#279477" stroke-width="2" stroke-linejoin="round"/>

  <!-- Additional consumer inflows -->
  <path d="M275 255 C275 310 275 335 275 390 L335 390 L335 490 L215 490 L215 390 C215 335 215 310 215 255 Z" fill="#6577d8" opacity="0.84"/>
  <path d="M585 255 C585 320 585 345 585 410 L625 410 L625 500 L545 500 L545 410 C545 345 545 320 545 255 Z" fill="#269ac3" opacity="0.84"/>
  <path d="M920 255 C920 320 920 345 920 400 L960 400 L960 510 L880 510 L880 400 C880 345 880 320 880 255 Z" fill="#24a77d" opacity="0.84"/>

  <!-- Consumer source cards -->
  <g filter="url(#shadow)">
    <rect x="155" y="135" width="180" height="120" rx="18" fill="#fff" stroke="#8390df" stroke-width="2"/>
    <rect x="505" y="135" width="160" height="120" rx="18" fill="#fff" stroke="#4ba9c9" stroke-width="2"/>
    <rect x="840" y="135" width="160" height="120" rx="18" fill="#fff" stroke="#4ab18e" stroke-width="2"/>
  </g>
  <text class="source-number" x="245" y="183">2,326</text>
  <text class="source-label" x="245" y="213">HVAC consumers</text>
  <text x="245" y="237" font-size="13" font-weight="550" text-anchor="middle" fill="#718396">initial heat loads</text>

  <text class="source-number" x="585" y="183">199</text>
  <text class="source-label" x="585" y="213">CW consumers</text>
  <text x="585" y="237" font-size="13" font-weight="550" text-anchor="middle" fill="#718396">entering at CW</text>

  <text class="source-number" x="920" y="183">66</text>
  <text class="source-label" x="920" y="213">FW consumers</text>
  <text x="920" y="237" font-size="13" font-weight="550" text-anchor="middle" fill="#718396">entering at FW</text>

  <!-- System nodes -->
  <g filter="url(#shadow)">
    <rect x="215" y="390" width="120" height="100" rx="12" fill="#f7f8ff" stroke="#6577d8" stroke-width="3"/>
    <rect x="505" y="410" width="120" height="90" rx="12" fill="#f1fbff" stroke="#269ac3" stroke-width="3"/>
    <rect x="840" y="400" width="120" height="110" rx="12" fill="#f1fcf8" stroke="#24a77d" stroke-width="3"/>
    <rect x="1440" y="365" width="125" height="190" rx="18" fill="#fff7e6" stroke="#dfa037" stroke-width="3"/>
  </g>

  <text class="system-code" x="275" y="437">HVAC</text>
  <text class="system-name" x="275" y="466">Air-side cooling</text>

  <text class="system-code" x="565" y="452">CW</text>
  <text class="system-name" x="565" y="477">Chilled Water</text>

  <text class="system-code" x="900" y="449">FW</text>
  <text class="system-name" x="900" y="477">Fresh Water</text>

  <text x="1502" y="430" font-size="26" font-weight="800" text-anchor="middle">External</text>
  <text x="1502" y="461" font-size="26" font-weight="800" text-anchor="middle">reservoir</text>
  <path d="M1472 498 Q1502 475 1532 498 Q1502 521 1472 498 Z" fill="#efad39" opacity="0.45"/>

  <!-- Flow labels, positioned clear of bands -->
  <text class="flow-title" x="420" y="552">Total HVAC load</text>
  <text class="flow-detail" x="420" y="576">propagates into CW</text>

  <text class="flow-title" x="732" y="552">HVAC load + 199 CW consumers</text>
  <text class="flow-detail" x="732" y="576">forms the total CW load</text>

  <text class="flow-title" x="1200" y="574">Total CW load + 66 FW consumers</text>
  <text class="flow-detail" x="1200" y="598">total FW load rejected to the external reservoir</text>

</svg>
